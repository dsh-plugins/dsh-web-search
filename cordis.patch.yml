# The dsh-web-search bundle patch: inserts this plugin into the profile entry
# list. Declared by `dsh.bundle.patch` in package.json, so `dsh plugin add`
# reconciles the package into `dsh.profile.bundles` and the profile boot
# applies this layer automatically — no manual cordis.patch.yml edit needed.
- insert:
    # Stable id so later layers can patch/disable this row by id.
    - id: dsh-web-search
      name: '@dsh-plugin/dsh-web-search'
